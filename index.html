<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劲神莅临成都还有：</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --gold: #e8c050;
    --gold-bright: #fff0a8;
    --gold-deep: #8a6a1f;
    --red: #e8342a;
    --red-deep: #7a1a14;
    --muted: #8a7a52;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--gold);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(232,192,80,0.18), transparent 60%),
      radial-gradient(ellipse at 30% 80%, rgba(232,52,42,0.15), transparent 50%),
      radial-gradient(ellipse at 70% 20%, rgba(240,200,80,0.10), transparent 50%),
      linear-gradient(180deg, #0a0a0c 0%, #14110d 50%, #0a0a0c 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 80px 24px 60px;
    position: relative;
  }

  @media (min-width: 900px) {
    body { justify-content: center; padding: 40px 24px; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.88 0 0 0 0 0.6 0 0 0 0.15 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.25;
    mix-blend-mode: overlay;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .rays {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      linear-gradient(115deg, transparent 40%, rgba(240,200,80,0.06) 50%, transparent 60%),
      linear-gradient(75deg, transparent 45%, rgba(232,52,42,0.04) 55%, transparent 65%);
  }

  .corner {
    position: fixed;
    width: 70px;
    height: 70px;
    z-index: 3;
    pointer-events: none;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--gold);
    box-shadow: 0 0 10px rgba(240,200,80,0.5);
  }
  .corner::before { width: 100%; height: 2px; }
  .corner::after { width: 2px; height: 100%; }
  .corner.tl { top: 32px; left: 32px; }
  .corner.tl::before { top: 0; left: 0; }
  .corner.tl::after { top: 0; left: 0; }
  .corner.tr { top: 32px; right: 32px; }
  .corner.tr::before { top: 0; right: 0; }
  .corner.tr::after { top: 0; right: 0; }
  .corner.bl { bottom: 32px; left: 32px; }
  .corner.bl::before { bottom: 0; left: 0; }
  .corner.bl::after { bottom: 0; left: 0; }
  .corner.br { bottom: 32px; right: 32px; }
  .corner.br::before { bottom: 0; right: 0; }
  .corner.br::after { bottom: 0; right: 0; }

  .stage {
    position: relative;
    z-index: 4;
    width: 100%;
    max-width: 1200px;
    text-align: center;
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === TOP: overline + today date + progress bar === */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding: 0 4px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .overline {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: 0.5em;
    color: var(--gold);
    text-indent: 0.5em;
    opacity: 0.85;
  }

  .today-pill {
    font-family: 'DM Mono', monospace;
    font-size: clamp(10px, 1.2vw, 12px);
    letter-spacing: 0.25em;
    color: var(--gold);
    opacity: 0.7;
    border: 1px solid var(--gold-deep);
    padding: 4px 14px;
  }

  /* progress bar */
  .progress-block {
    margin-bottom: 32px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  .progress-meta .pct {
    color: var(--gold);
    font-weight: 500;
  }

  .progress-track {
    height: 4px;
    background: rgba(138,106,31,0.25);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-bright));
    box-shadow: 0 0 12px rgba(240,200,80,0.6);
    transition: width 1s ease-out;
    width: 0%;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: -3px;
    width: 10px;
    height: 10px;
    background: var(--gold-bright);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--gold-bright);
  }

  /* SVG title */
  .title-svg {
    display: block;
    width: 100%;
    height: auto;
    min-height: 80px;
    margin-bottom: 8px;
    overflow: visible;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 28px 0 24px;
  }

  .ornament .line {
    height: 1px;
    width: clamp(50px, 10vw, 140px);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .ornament .diamond {
    width: 10px;
    height: 10px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 14px rgba(240,200,80,0.7);
  }

  .target-date {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(20px, 2.6vw, 28px);
    color: var(--gold);
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(212,168,75,0.4);
    margin-bottom: 40px;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(12px, 3vw, 36px);
    max-width: 1000px;
    margin: 0 auto;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 16px 0;
  }

  .unit:not(:last-child)::after {
    content: ':';
    position: absolute;
    top: 22%;
    right: calc(-1 * clamp(6px, 1.5vw, 18px));
    color: var(--gold-deep);
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(40px, 6vw, 80px);
    opacity: 0.7;
  }

  .num {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(56px, 11vw, 140px);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: #f0c850;
    text-shadow:
      2px 2px 0 rgba(122,26,20,0.8),
      0 0 25px rgba(232,192,80,0.5);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .num.tick {
    animation: tick 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes tick {
    0% { transform: translateY(0); opacity: 1; }
    40% { transform: translateY(-10px); opacity: 0.4; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 16px;
    opacity: 0.85;
  }

  .label .cn {
    display: block;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-top: 4px;
  }

  /* === BOTTOM: mood quote + waiting log === */
  .bottom-block {
    margin-top: 56px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
    text-align: left;
  }

  .info-card {
    border: 1px solid var(--gold-deep);
    background: rgba(20,17,13,0.6);
    padding: 22px 24px;
    position: relative;
    backdrop-filter: blur(2px);
  }

  .info-card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: -1px;
    width: 14px;
    height: 14px;
    border-top: 2px solid var(--gold);
    border-left: 2px solid var(--gold);
  }

  .info-card::after {
    content: '';
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 14px;
    height: 14px;
    border-bottom: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
  }

  .info-card .card-label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0.8;
  }

  .info-card .card-label .cn {
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--muted);
    margin-left: 12px;
  }

  .info-card .card-content {
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: clamp(15px, 1.8vw, 18px);
    line-height: 1.7;
    color: var(--gold-bright);
    letter-spacing: 0.05em;
  }

  .info-card .card-content .accent {
    color: #ff7060;
    font-weight: 700;
  }

  .arrived {
    font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: clamp(40px, 8vw, 100px);
    line-height: 1.2;
    padding: 40px 0;
    color: #f0c850;
    text-shadow:
      3px 3px 0 #7a1a14,
      5px 5px 0 #4a0a08,
      0 0 40px rgba(240,200,80,0.8);
    transform: skewX(-6deg);
    animation: glow 2s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  @media (max-width: 700px) {
    .bottom-block { grid-template-columns: 1fr; gap: 16px; margin-top: 36px; }
  }

  @media (max-width: 600px) {
    .corner { width: 30px; height: 30px; }
    .corner.tl { top: 12px; left: 12px; }
    .corner.tr { top: 12px; right: 12px; }
    .corner.bl { bottom: 12px; left: 12px; }
    .corner.br { bottom: 12px; right: 12px; }
    .countdown { gap: 6px; }
    .unit:not(:last-child)::after { font-size: 32px; right: -4px; }
    .overline { letter-spacing: 0.25em; font-size: 10px; }
    .today-pill { font-size: 9px; padding: 3px 10px; letter-spacing: 0.15em; }
    .top-bar { margin-bottom: 20px; }
    .title-svg { min-height: 50px; }
    .progress-block { margin-bottom: 24px; }
    .ornament { margin: 20px 0 18px; }
    .target-date { margin-bottom: 28px; }
    .info-card { padding: 16px 18px; }
    .info-card .card-content { font-size: 14px; line-height: 1.6; }
  }
</style>
</head>
<body>

<div class="rays"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="stage">

  <div class="top-bar">
    <div class="overline">THE ARRIVAL</div>
    <div class="today-pill" id="todayPill">—</div>
  </div>

  <div class="progress-block">
    <div class="progress-meta">
      <span>WAITING PROGRESS</span>
      <span class="pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <svg class="title-svg" viewBox="0 0 1000 180" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff4c4"/>
        <stop offset="30%" stop-color="#f0c850"/>
        <stop offset="55%" stop-color="#a8801f"/>
        <stop offset="75%" stop-color="#d4a84b"/>
        <stop offset="100%" stop-color="#f5dc8a"/>
      </linearGradient>
      <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff5040"/>
        <stop offset="50%" stop-color="#e8342a"/>
        <stop offset="100%" stop-color="#7a1a14"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g transform="translate(500 110) skewX(-8) translate(-500 -110)">
      <text x="500" y="120" text-anchor="middle"
        font-family="ZCOOL QingKe HuangYou, Noto Serif SC, serif"
        font-weight="900" font-size="140"
        fill="#4a0a08" opacity="0.85">
        劲神莅临成都还有<tspan>：</tspan>
      </text>
      <text x="496" y="116" text-anchor="middle"
        font-family="ZCOOL QingKe HuangYou, Noto Serif SC, serif"
        font-weight="900" font-size="140"
        fill="#7a1a14">
        劲神莅临成都还有<tspan>：</tspan>
      </text>
      <text x="492" y="112" text-anchor="middle"
        font-family="ZCOOL QingKe HuangYou, Noto Serif SC, serif"
        font-weight="900" font-size="140"
        fill="url(#goldGrad)"
        filter="url(#glow)">
        劲神莅临成都还有<tspan fill="url(#redGrad)">：</tspan>
      </text>
    </g>
  </svg>

  <div class="ornament">
    <div class="line"></div>
    <div class="diamond"></div>
    <div class="line"></div>
  </div>

  <div class="target-date" id="targetDate">June 20</div>

  <div id="countdownArea">
    <div class="countdown">
      <div class="unit">
        <div class="num" id="days">00</div>
        <div class="label">Days<span class="cn">天</span></div>
      </div>
      <div class="unit">
        <div class="num" id="hours">00</div>
        <div class="label">Hours<span class="cn">时</span></div>
      </div>
      <div class="unit">
        <div class="num" id="minutes">00</div>
        <div class="label">Minutes<span class="cn">分</span></div>
      </div>
      <div class="unit">
        <div class="num" id="seconds">00</div>
        <div class="label">Seconds<span class="cn">秒</span></div>
      </div>
    </div>
  </div>

  <!-- bottom info cards -->
  <div class="bottom-block">
    <div class="info-card">
      <div class="card-label">Today's Mood <span class="cn">· 今日心境</span></div>
      <div class="card-content" id="moodText">—</div>
    </div>
    <div class="info-card">
      <div class="card-label">Fun Fact <span class="cn">· 小知识</span></div>
      <div class="card-content" id="factText">—</div>
    </div>
  </div>

</div>

<script>
  function getTarget() {
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 5, 20, 0, 0, 0);
    if (target.getTime() <= now.getTime()) {
      target = new Date(year + 1, 5, 20, 0, 0, 0);
    }
    return target;
  }

  const target = getTarget();
  // Start anchor: April 25 of the same year as target (or year before, if target rolled over)
  const startAnchor = new Date(target.getFullYear(), 3, 25, 0, 0, 0); // month 3 = April

  document.getElementById('targetDate').textContent =
    `${target.getFullYear()} · 六月二十日 · June 20`;

  // today pill
  function updateToday() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const w = ['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
    document.getElementById('todayPill').textContent = `${yyyy}.${mm}.${dd} · ${w}`;
  }

  // mood quote based on days remaining
  function getMood(days) {
    if (days > 60) return '日子还长，慢慢酝酿期待。<span class="accent">耐心</span>是最浪漫的修行。';
    if (days > 30) return '已经能闻到一点风的味道了。<span class="accent">把日子过好</span>，等他来。';
    if (days > 14) return '进入两位数倒计时。<span class="accent">屏息以待</span>，每一天都更近一步。';
    if (days > 7) return '不到一周了，心跳是不是有点快？<span class="accent">劲神在路上</span>。';
    if (days > 3) return '指尖都开始发烫。<span class="accent">三五天</span>，最长也最短。';
    if (days > 1) return '就要见到了！<span class="accent">把最好的状态</span>留给那一天。';
    if (days === 1) return '<span class="accent">就是明天！</span>今晚好好睡，明天劲神就到。';
    if (days === 0) return '<span class="accent">就在今天！</span>整个成都都在等。';
    return '愿这场相见值得所有等待。';
  }

  // fun facts that cycle by day
  const facts = [
    '成都人均火锅店密度全国第一，劲神来了一定吃得好。',
    '成都的"巴适"=很舒服，也很适合这次相聚。',
    '锦江夜色配冰啤，是六月成都最佳搭配。',
    '成都的太阳鸟金箔是 3000 年前的设计，比奢侈品早多了。',
    '六月的成都常有雷阵雨，记得带伞。',
    '"安逸"是四川人最高级的褒义词，配劲神刚刚好。',
    '宽窄巷子的盖碗茶能坐一整个下午，劲神来了一起。',
    '熊猫一天吃 14 小时竹子，比追星还专注。',
    '成都地铁现在有 13 条线，去哪都方便。',
    '凌晨两点的成都还有人吃串串，是真·不夜城。',
    '都江堰是 2200 年前修的，到今天还在用，比任何承诺都长情。',
    '川剧变脸 0.27 秒一张，比反应速度都快。',
    '成都话"摆龙门阵"=聊天，可以摆一整夜。',
    '六月成都日均气温 23°C，正适合出门。',
  ];

  function getFact() {
    const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
    return facts[dayOfYear % facts.length];
  }

  const $days = document.getElementById('days');
  const $hours = document.getElementById('hours');
  const $minutes = document.getElementById('minutes');
  const $seconds = document.getElementById('seconds');
  const $area = document.getElementById('countdownArea');
  const $progressFill = document.getElementById('progressFill');
  const $progressPct = document.getElementById('progressPct');
  const $moodText = document.getElementById('moodText');
  const $factText = document.getElementById('factText');

  let last = { d: -1, h: -1, m: -1, s: -1 };

  function pad(n) { return String(n).padStart(2, '0'); }

  function tickAnim(el) {
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  }

  let timer;

  function update() {
    const now = new Date();
    const diff = target.getTime() - now.getTime();

    if (diff <= 0) {
      $area.innerHTML = '<div class="arrived">劲神已抵达成都</div>';
      $progressFill.style.width = '100%';
      $progressPct.textContent = '100%';
      $moodText.innerHTML = '<span class="accent">久等了！</span>这一刻终于到了。';
      clearInterval(timer);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    if (seconds !== last.s) {
      $seconds.textContent = pad(seconds);
      tickAnim($seconds);
      last.s = seconds;
    }
    if (minutes !== last.m) {
      $minutes.textContent = pad(minutes);
      if (last.m !== -1) tickAnim($minutes);
      last.m = minutes;
    }
    if (hours !== last.h) {
      $hours.textContent = pad(hours);
      if (last.h !== -1) tickAnim($hours);
      last.h = hours;
    }
    if (days !== last.d) {
      $days.textContent = pad(days);
      if (last.d !== -1) tickAnim($days);
      last.d = days;
      // update mood when day changes
      $moodText.innerHTML = getMood(days);
    }

    // progress: how far along we are from anchor to target
    const totalSpan = target.getTime() - startAnchor.getTime();
    const elapsed = now.getTime() - startAnchor.getTime();
    let pct = Math.max(0, Math.min(100, (elapsed / totalSpan) * 100));
    $progressFill.style.width = pct.toFixed(2) + '%';
    $progressPct.textContent = pct.toFixed(1) + '%';
  }

  updateToday();
  $factText.textContent = getFact();
  update();
  timer = setInterval(update, 1000);
  // refresh today + fact at midnight-ish
  setInterval(() => {
    updateToday();
    $factText.textContent = getFact();
  }, 60000);
</script>

</body>
</html>
