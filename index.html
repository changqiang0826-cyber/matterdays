<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劲神莅临成都还有：</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --gold: #e8c050;
    --gold-bright: #fff0a8;
    --gold-deep: #8a6a1f;
    --red: #e8342a;
    --red-deep: #7a1a14;
    --muted: #8a7a52;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--gold);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(232,192,80,0.18), transparent 60%),
      radial-gradient(ellipse at 30% 80%, rgba(232,52,42,0.15), transparent 50%),
      radial-gradient(ellipse at 70% 20%, rgba(240,200,80,0.10), transparent 50%),
      linear-gradient(180deg, #0a0a0c 0%, #14110d 50%, #0a0a0c 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    position: relative;
  }

  /* film grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.88 0 0 0 0 0.6 0 0 0 0.15 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.25;
    mix-blend-mode: overlay;
  }

  /* vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* diagonal light rays */
  .rays {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      linear-gradient(115deg, transparent 40%, rgba(240,200,80,0.06) 50%, transparent 60%),
      linear-gradient(75deg, transparent 45%, rgba(232,52,42,0.04) 55%, transparent 65%);
  }

  /* gold corner brackets */
  .corner {
    position: fixed;
    width: 70px;
    height: 70px;
    z-index: 3;
    pointer-events: none;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--gold);
    box-shadow: 0 0 10px rgba(240,200,80,0.5);
  }
  .corner::before { width: 100%; height: 2px; }
  .corner::after { width: 2px; height: 100%; }
  .corner.tl { top: 32px; left: 32px; }
  .corner.tl::before { top: 0; left: 0; }
  .corner.tl::after { top: 0; left: 0; }
  .corner.tr { top: 32px; right: 32px; }
  .corner.tr::before { top: 0; right: 0; }
  .corner.tr::after { top: 0; right: 0; }
  .corner.bl { bottom: 32px; left: 32px; }
  .corner.bl::before { bottom: 0; left: 0; }
  .corner.bl::after { bottom: 0; left: 0; }
  .corner.br { bottom: 32px; right: 32px; }
  .corner.br::before { bottom: 0; right: 0; }
  .corner.br::after { bottom: 0; right: 0; }

  .stage {
    position: relative;
    z-index: 4;
    width: 100%;
    max-width: 1400px;
    text-align: center;
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .overline {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(11px, 1.6vw, 15px);
    letter-spacing: 0.6em;
    color: var(--gold);
    text-indent: 0.6em;
    margin-bottom: 32px;
    opacity: 0.85;
  }

  /* THE BIG TITLE - single line, auto-scaled */
  .title-wrap {
    width: 100%;
    overflow: hidden;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 160px;
    line-height: 1.15;
    letter-spacing: 0.04em;
    white-space: nowrap;
    display: inline-block;

    /* SOLID gold color - guaranteed to render */
    color: #f0c850;

    /* multi-layer shadow for cinematic depth */
    text-shadow:
      3px 3px 0 #7a1a14,
      4px 4px 0 #7a1a14,
      5px 5px 0 #4a0a08,
      0 0 30px rgba(232,192,80,0.6),
      0 0 60px rgba(232,52,42,0.4);

    /* dynamic tilt */
    transform: skewX(-6deg);
    transform-origin: center;
    padding: 12px 0;
  }

  h1 .accent {
    color: #ff4030;
    text-shadow:
      3px 3px 0 #4a0a08,
      4px 4px 0 #4a0a08,
      0 0 30px rgba(255,80,60,0.8);
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 36px 0 32px;
  }

  .ornament .line {
    height: 1px;
    width: clamp(50px, 10vw, 140px);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .ornament .diamond {
    width: 10px;
    height: 10px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 14px rgba(240,200,80,0.7);
  }

  .target-date {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(20px, 2.6vw, 28px);
    color: var(--gold);
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(212,168,75,0.4);
    margin-bottom: 48px;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(12px, 3vw, 36px);
    max-width: 1000px;
    margin: 0 auto;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 16px 0;
  }

  .unit:not(:last-child)::after {
    content: ':';
    position: absolute;
    top: 22%;
    right: calc(-1 * clamp(6px, 1.5vw, 18px));
    color: var(--gold-deep);
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(40px, 6vw, 80px);
    opacity: 0.7;
  }

  .num {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(56px, 11vw, 140px);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: #f0c850;
    text-shadow:
      2px 2px 0 rgba(122,26,20,0.8),
      0 0 25px rgba(232,192,80,0.5);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .num.tick {
    animation: tick 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes tick {
    0% { transform: translateY(0); opacity: 1; }
    40% { transform: translateY(-10px); opacity: 0.4; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 16px;
    opacity: 0.85;
  }

  .label .cn {
    display: block;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-top: 4px;
  }

  .arrived {
    font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: clamp(40px, 8vw, 100px);
    line-height: 1.2;
    padding: 40px 0;
    color: #f0c850;
    text-shadow:
      3px 3px 0 #7a1a14,
      5px 5px 0 #4a0a08,
      0 0 40px rgba(240,200,80,0.8);
    transform: skewX(-6deg);
    animation: glow 2s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  @media (max-width: 600px) {
    .corner { width: 40px; height: 40px; }
    .corner.tl { top: 16px; left: 16px; }
    .corner.tr { top: 16px; right: 16px; }
    .corner.bl { bottom: 16px; left: 16px; }
    .corner.br { bottom: 16px; right: 16px; }
    .countdown { gap: 8px; }
    .unit:not(:last-child)::after { font-size: 36px; right: -6px; }
    .overline { letter-spacing: 0.4em; }
  }
</style>
</head>
<body>

<div class="rays"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="stage">
  <div class="overline">THE ARRIVAL</div>

  <div class="title-wrap">
    <h1 id="title">劲神莅临成都还有<span class="accent">：</span></h1>
  </div>

  <div class="ornament">
    <div class="line"></div>
    <div class="diamond"></div>
    <div class="line"></div>
  </div>

  <div class="target-date" id="targetDate">June 20</div>

  <div id="countdownArea">
    <div class="countdown">
      <div class="unit">
        <div class="num" id="days">00</div>
        <div class="label">Days<span class="cn">天</span></div>
      </div>
      <div class="unit">
        <div class="num" id="hours">00</div>
        <div class="label">Hours<span class="cn">时</span></div>
      </div>
      <div class="unit">
        <div class="num" id="minutes">00</div>
        <div class="label">Minutes<span class="cn">分</span></div>
      </div>
      <div class="unit">
        <div class="num" id="seconds">00</div>
        <div class="label">Seconds<span class="cn">秒</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Auto-scale title to fit on one line
  function fitTitle() {
    const title = document.getElementById('title');
    if (!title) return;
    const wrap = title.parentElement;
    title.style.transform = 'skewX(-6deg) scale(1)';
    const wrapWidth = wrap.clientWidth - 16;
    const naturalWidth = title.scrollWidth;
    if (naturalWidth > wrapWidth) {
      const scale = wrapWidth / naturalWidth;
      title.style.transform = `skewX(-6deg) scale(${scale})`;
      title.style.transformOrigin = 'center';
    }
  }

  window.addEventListener('load', fitTitle);
  window.addEventListener('resize', fitTitle);
  if (document.fonts) {
    document.fonts.ready.then(fitTitle);
  }
  // try a few times in case fonts load slowly
  setTimeout(fitTitle, 200);
  setTimeout(fitTitle, 800);
  setTimeout(fitTitle, 2000);

  // Countdown
  function getTarget() {
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 5, 20, 0, 0, 0);
    if (target.getTime() <= now.getTime()) {
      target = new Date(year + 1, 5, 20, 0, 0, 0);
    }
    return target;
  }

  const target = getTarget();
  document.getElementById('targetDate').textContent =
    `${target.getFullYear()} · 六月二十日 · June 20`;

  const $days = document.getElementById('days');
  const $hours = document.getElementById('hours');
  const $minutes = document.getElementById('minutes');
  const $seconds = document.getElementById('seconds');
  const $area = document.getElementById('countdownArea');

  let last = { d: -1, h: -1, m: -1, s: -1 };

  function pad(n) { return String(n).padStart(2, '0'); }

  function tickAnim(el) {
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  }

  let timer;

  function update() {
    const now = new Date();
    const diff = target.getTime() - now.getTime();

    if (diff <= 0) {
      $area.innerHTML = '<div class="arrived">劲神已抵达成都</div>';
      clearInterval(timer);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    if (seconds !== last.s) {
      $seconds.textContent = pad(seconds);
      tickAnim($seconds);
      last.s = seconds;
    }
    if (minutes !== last.m) {
      $minutes.textContent = pad(minutes);
      if (last.m !== -1) tickAnim($minutes);
      last.m = minutes;
    }
    if (hours !== last.h) {
      $hours.textContent = pad(hours);
      if (last.h !== -1) tickAnim($hours);
      last.h = hours;
    }
    if (days !== last.d) {
      $days.textContent = pad(days);
      if (last.d !== -1) tickAnim($days);
      last.d = days;
    }
  }

  update();
  timer = setInterval(update, 1000);
</script>

</body>
</html>
